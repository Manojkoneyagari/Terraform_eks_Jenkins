apiVersion: apps/v1
kind: Deployment 
metadata:
  name: deployment-1
  namespace: roboshop
  labels:
    project: roboshop
    purpose: nginx 

spec:
  replicas: 2
  selector:
    matchLabels:
      component: app1
      
  
  template:
    metadata:
      labels:
        component: app1
    spec:
      containers:
      - name: nginx-1
        image: manojkoneyagari/app1
        resources:
          requests:
            cpu: "120m"
            memory: "150Mi"
          limits:
            cpu: "150m"
            memory: "150Mi"


---
apiVersion: v1
kind: Service 
metadata:
  name: app1-service 
  namespace: roboshop
  labels:
    component: app1
spec:
  selector:
    component: app1

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80


---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: app1
  namespace: roboshop
spec:
  serviceRef:
    name: app1 # route traffic to the awesome-service
    port: 80
  targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:978236789333:targetgroup/Roboshop-tg-app1/857033e50d7c5ce8
  targetType: ip


