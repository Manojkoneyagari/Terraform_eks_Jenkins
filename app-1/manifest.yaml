apiVersion: apps/v1
kind: Deployment 
metadata:
  name: deployment-1
  labels:
    project: roboshop
    purpose: nginx 

spec:
  replicas: 2
  selector:
    matchLabels:
      component: app1
      
  
  template:
    metadata:
      labels:
        component: app1
    spec:
      containers:
      - name: nginx-1
        image: manojkoneyagari/app1
        resources:
          requests:
            cpu: "120m"
            memory: "150Mi"
          limits:
            cpu: "150m"
            memory: "150Mi"


---
apiVersion: v1
kind: Service 
metadata:
  name: app1-service 
  labels:
    component: app1
spec:
  selector:
    component: app1

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:978236789333:certificate/a23a49ad-6678-4810-ae9d-a78d9694efb2
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=test
    alb.ingress.kubernetes.io/group.name: roboshop
    


spec:
  ingressClassName: alb

  rules:
  - host: "app1.manojkoney.store"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service 
            port:
              number: 80



