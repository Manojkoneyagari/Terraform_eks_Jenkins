apiVersion: apps/v1
kind: Deployment 
metadata:
  name: deployment-2
  namespace: roboshop
  labels:
    project: roboshop
    purpose: nginx 

spec:
  replicas: 2
  selector:
    matchLabels:
      component: app2
      
  
  template:
    metadata:
      labels:
        component: app2
    spec:
      containers:
      - name: nginx-2
        image: manojkoneyagari/app2
        resources:
          requests:
            cpu: "120m"
            memory: "150Mi"
          limits:
            cpu: "150m"
            memory: "150Mi"


---
apiVersion: v1
kind: Service 
metadata:
  name: app2-service 
  namespace: roboshop
  labels:
    component: app2
spec:
  selector:
    component: app2

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80


---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: app2
  namespace: roboshop
spec:
  serviceRef:
    name: app2 # route traffic to the awesome-service
    port: 80
  targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:160885265516:targetgroup/roboshop-dev-frontend/13ffd560fd8ed9f8
  targetType: ip